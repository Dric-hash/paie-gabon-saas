<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Page introuvable — PaieGabon</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Inter:wght@400;500&display=swap');
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Inter',system-ui,sans-serif; min-height:100vh; display:flex;
           align-items:center; justify-content:center; padding:1.5rem;
           background:linear-gradient(135deg,#0f3d36 0%,#0c322c 100%); color:#12211d; }
    .card { background:#f6f4ec; border-radius:1.5rem; max-width:460px; width:100%;
            padding:2.5rem 2rem; text-align:center; box-shadow:0 20px 60px -15px rgba(0,0,0,.4); }
    .icon { font-size:3.5rem; margin-bottom:1rem; }
    h1 { font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:1.4rem; color:#0f3d36; margin-bottom:.6rem; }
    p { color:#5a6b64; font-size:.92rem; line-height:1.6; margin-bottom:1.5rem; }
    .btns { display:flex; gap:.65rem; flex-direction:column; }
    .btn { padding:.8rem 1.25rem; border-radius:.75rem; font-weight:700; font-size:.9rem;
           text-decoration:none; border:none; cursor:pointer; font-family:'Inter',sans-serif; }
    .btn-primary { background:#0f3d36; color:white; }
    .btn-ghost { background:transparent; color:#0f3d36; border:1px solid #cdd6d1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🧭</div>
    <h1>Page introuvable</h1>
    <p>La page que vous cherchez n'existe pas ou a été déplacée. Revenons en terrain connu.</p>
    <div class="btns">
      <a class="btn btn-primary" href="/dashboard">Aller au tableau de bord</a>
      <a class="btn btn-ghost" href="/">Retour à l'accueil</a>
    </div>
  </div>
</body>
</html>
