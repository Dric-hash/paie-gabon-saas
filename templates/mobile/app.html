<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0f3d36"/>
<link rel="manifest" href="/m/manifest.webmanifest"/>
<link rel="apple-touch-icon" href="/static/icons/icon-192.png"/>
<title>Pointage chantier — PaieGabon</title>
<style>
  :root{ --teal:#0f3d36; --teal2:#17564c; --or:#E9B043; --creme:#F5F3EE;
         --ok:#059669; --no:#dc2626; --line:#e5e7eb; --ink:#1f2937; --mute:#6b7280; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--creme);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:none}
  .wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header{background:var(--teal);color:#fff;padding:1rem 1.1rem;position:sticky;top:0;z-index:10}
  header .ligne{display:flex;justify-content:space-between;align-items:center;gap:.6rem}
  header h1{font-size:1.05rem;font-weight:800;margin:0}
  header .sub{font-size:.78rem;color:rgba(255,255,255,.75);margin-top:.15rem}
  .net{font-size:.72rem;font-weight:700;padding:.2rem .55rem;border-radius:9999px;white-space:nowrap}
  .net.on{background:rgba(255,255,255,.15);color:#d1fae5}
  .net.off{background:#7f1d1d;color:#fecaca}
  main{flex:1;padding:1rem 1.1rem 6rem}
  .card{background:#fff;border:1px solid var(--line);border-radius:.9rem;padding:1rem;margin-bottom:.8rem}
  label{font-size:.76rem;font-weight:700;color:#374151;display:block;margin-bottom:.2rem}
  input,select{width:100%;padding:.6rem;border:1px solid #d1d5db;border-radius:.6rem;font-size:1rem;box-sizing:border-box;background:#fff}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
  .btn{display:block;width:100%;border:none;border-radius:.7rem;padding:.85rem;font-size:1rem;font-weight:800;cursor:pointer}
  .btn.primary{background:var(--teal);color:#fff}
  .btn.or{background:var(--or);color:#3a2a00}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--mute)}
  .sal{display:flex;align-items:center;gap:.6rem;padding:.6rem 0;border-top:1px solid #f3f4f6}
  .sal:first-child{border-top:none}
  .sal .nom{flex:1;font-weight:700;font-size:.95rem;line-height:1.15}
  .sal .nom small{display:block;font-weight:400;color:var(--mute);font-size:.72rem}
  .seg{display:flex;border:1px solid var(--line);border-radius:.55rem;overflow:hidden}
  .seg button{border:none;background:#fff;padding:.45rem .7rem;font-weight:800;font-size:.82rem;cursor:pointer;color:var(--mute)}
  .seg button.p.actif{background:var(--ok);color:#fff}
  .seg button.a.actif{background:var(--no);color:#fff}
  .hidden{display:none!important}
  .foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
    padding:.7rem 1.1rem;max-width:560px;margin:0 auto}
  .toast{position:fixed;left:50%;bottom:5.3rem;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:.6rem 1rem;border-radius:.6rem;font-size:.85rem;max-width:90%;text-align:center;z-index:50;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
  .pill{font-size:.72rem;font-weight:700;color:var(--or)}
  .logo{width:30px;height:30px;border-radius:7px}
  .motif{margin-top:.4rem}
  a.lien{color:var(--teal2);font-size:.8rem}
  .center{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:1.5rem}
</style>
</head>
<body>
<div class="wrap">

  <!-- ÉCRAN CONNEXION -->
  <section id="vue-login" class="center">
    <div style="text-align:center;margin-bottom:1.5rem">
      <img class="logo" src="/static/icons/icon-192.png" style="width:64px;height:64px;border-radius:16px"/>
      <h1 style="color:var(--teal);margin:.6rem 0 .1rem;font-size:1.35rem">Pointage chantier</h1>
      <p style="color:var(--mute);font-size:.85rem;margin:0">Connectez-vous avec votre code pointeur.</p>
    </div>
    <div class="card">
      <div style="margin-bottom:.7rem"><label>Code pointeur</label>
        <input id="in-code" autocapitalize="characters" autocomplete="off" placeholder="PT-XXXXXX" style="text-transform:uppercase"/></div>
      <div style="margin-bottom:1rem"><label>PIN</label>
        <input id="in-pin" inputmode="numeric" autocomplete="off" placeholder="••••" type="password"/></div>
      <button class="btn primary" id="btn-login">Se connecter</button>
      <p id="login-err" style="color:var(--no);font-size:.82rem;margin:.6rem 0 0;text-align:center"></p>
    </div>
    <p style="text-align:center;color:var(--mute);font-size:.75rem;margin-top:1rem">PaieGabon · Ameriack I.T. Solutions</p>
  </section>

  <!-- ÉCRAN POINTAGE -->
  <section id="vue-app" class="hidden">
    <header>
      <div class="ligne">
        <div>
          <h1>Pointage chantier</h1>
          <div class="sub" id="h-ent">—</div>
        </div>
        <span class="net off" id="net">hors-ligne</span>
      </div>
    </header>
    <main>
      <div class="card">
        <label>Chantier</label>
        <select id="in-site"></select>
        <div class="row" style="margin-top:.7rem">
          <div><label>Date du pointage</label><input type="date" id="in-date"/></div>
          <div></div>
        </div>
        <div class="row" style="margin-top:.7rem">
          <div><label>Heures normales (équipe)</label><input id="in-hn" inputmode="decimal" value="8"/></div>
          <div><label>Heures sup. (équipe)</label><input id="in-hs" inputmode="decimal" value="0"/></div>
        </div>
        <p style="font-size:.74rem;color:var(--mute);margin:.5rem 0 0">Valeurs appliquées à tous les présents. Ajustables par salarié plus bas si besoin.</p>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.3rem">
          <strong style="color:var(--teal)">Équipe du chantier</strong>
          <span style="font-size:.8rem;color:var(--mute)"><span id="cnt-p">0</span> présents · <span id="cnt-a">0</span> absents</span>
        </div>
        <div style="display:flex;gap:.5rem;margin-bottom:.5rem">
          <button class="btn ghost" style="padding:.45rem" onclick="App.tousPresents(true)">Tous présents</button>
          <input id="in-rech" placeholder="Rechercher…" style="flex:1"/>
        </div>
        <div id="liste"></div>
        <button class="btn ghost" style="margin-top:.6rem" id="btn-ajouter">➕ Ajouter un travailleur (permuté)</button>
        <div id="panel-ajout" class="hidden" style="margin-top:.6rem;border-top:1px solid var(--line);padding-top:.6rem">
          <input id="in-rech-ajout" placeholder="Rechercher dans toute l'entreprise…"/>
          <div id="liste-ajout" style="max-height:40vh;overflow:auto;margin-top:.5rem"></div>
        </div>
      </div>
    </main>
    <div class="foot">
      <div style="display:flex;gap:.6rem;align-items:center">
        <button class="btn primary" style="flex:2" id="btn-save">Enregistrer le pointage</button>
        <button class="btn ghost" style="flex:1" id="btn-sync">Sync <span id="pend" class="pill"></span></button>
      </div>
      <div style="text-align:center;margin-top:.4rem"><a class="lien" href="#" id="btn-logout">Changer de pointeur</a></div>
    </div>
  </section>

  <div class="toast" id="toast"></div>
</div>

<script>
const App = (function(){
  "use strict";
  const API = "/m/api";
  let roster = null, token = null, etat = {};  // etat[wkey] = {present, absent, motif, hn, hs}
  let selSite = null;              // chantier sélectionné (id)
  let ajoutes = new Set();         // wkey des travailleurs ajoutés manuellement (permutés)

  // ───────── IndexedDB (meta + file de pointages) ─────────
  function db(){
    return new Promise((res,rej)=>{
      const r = indexedDB.open("pg-pointage",1);
      r.onupgradeneeded = ()=>{ const d=r.result;
        if(!d.objectStoreNames.contains("meta")) d.createObjectStore("meta");
        if(!d.objectStoreNames.contains("queue")) d.createObjectStore("queue",{keyPath:"uuid"});
      };
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    });
  }
  async function idbGet(store,key){ const d=await db(); return new Promise((res,rej)=>{
    const t=d.transaction(store).objectStore(store).get(key); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error);});}
  async function idbSet(store,key,val){ const d=await db(); return new Promise((res,rej)=>{
    const s=d.transaction(store,"readwrite").objectStore(store); const t = (store==="queue")?s.put(val):s.put(val,key);
    t.onsuccess=()=>res(); t.onerror=()=>rej(t.error);});}
  async function idbAll(store){ const d=await db(); return new Promise((res,rej)=>{
    const t=d.transaction(store).objectStore(store).getAll(); t.onsuccess=()=>res(t.result||[]); t.onerror=()=>rej(t.error);});}
  async function idbDel(store,key){ const d=await db(); return new Promise((res,rej)=>{
    const t=d.transaction(store,"readwrite").objectStore(store).delete(key); t.onsuccess=()=>res(); t.onerror=()=>rej(t.error);});}

  // ───────── Utilitaires UI ─────────
  const $=(s)=>document.querySelector(s);
  function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2600); }
  function majReseau(){ const on=navigator.onLine; const n=$("#net");
    n.textContent=on?"en ligne":"hors-ligne"; n.className="net "+(on?"on":"off"); }

  // ───────── Rendu de l'équipe ─────────
  // Clé composite type+id (un salarié et un journalier peuvent avoir le même id).
  function wkey(s){ return (s.type||"S")+":"+s.id; }
  function initEtat(){ etat={}; (roster.salaries||[]).forEach(s=>{ etat[wkey(s)]={present:true,absent:false,motif:"",hn:null,hs:null}; }); }
  // Travailleur visible dans l'équipe du chantier : affecté au chantier choisi,
  // ou ajouté manuellement (permuté).
  function dansEquipe(s){
    if(ajoutes.has(wkey(s))) return true;
    const ids=s.site_ids||[];
    if(selSite==null) return ids.length===0;   // pas de chantier choisi : les non-affectés
    return ids.indexOf(selSite)>=0;
  }
  function render(){
    const q=($("#in-rech").value||"").toLowerCase();
    const box=$("#liste"); box.innerHTML="";
    let np=0,na=0;
    (roster.salaries||[]).forEach(s=>{
      if(!dansEquipe(s)) return;
      const k=wkey(s), e=etat[k]; if(!e) return; if(e.present)np++; if(e.absent)na++;
      const nom=(s.nom+" "+(s.prenom||"")).toLowerCase();
      if(q && nom.indexOf(q)<0) return;
      const badge = s.type==="J" ? ' <span style="font-size:.62rem;background:#eef4f2;color:#17564c;padding:.05rem .35rem;border-radius:.3rem;vertical-align:middle">journalier</span>' : '';
      const moi = s.est_pointeur ? ' <span style="font-size:.62rem;background:#fef3c7;color:#92400e;padding:.05rem .35rem;border-radius:.3rem">moi</span>' : '';
      const perm = (ajoutes.has(k) && (s.site_ids||[]).indexOf(selSite)<0) ? ' <span style="font-size:.62rem;background:#e0e7ff;color:#3730a3;padding:.05rem .35rem;border-radius:.3rem">permuté</span>' : '';
      const d=document.createElement("div"); d.className="sal";
      d.innerHTML =
        '<div class="nom">'+s.nom+' '+(s.prenom||'')+badge+moi+perm+'<small>'+(s.emploi||s.matricule||'')+'</small>'+
          '<div class="motif hidden" data-m="'+k+'"></div></div>'+
        '<div class="seg"><button class="p '+(e.present?'actif':'')+'" data-p="'+k+'">Présent</button>'+
          '<button class="a '+(e.absent?'actif':'')+'" data-a="'+k+'">Absent</button></div>';
      box.appendChild(d);
      if(e.absent){ const m=d.querySelector('[data-m="'+k+'"]'); m.classList.remove("hidden");
        m.innerHTML='<select data-motif="'+k+'" style="margin-top:.4rem">'+
          ['Congé','Maladie','Absence non justifiée','Permission','Repos'].map(x=>'<option'+(e.motif===x?' selected':'')+'>'+x+'</option>').join('')+'</select>'; }
    });
    $("#cnt-p").textContent=np; $("#cnt-a").textContent=na;
  }

  function bindListe(){
    $("#liste").addEventListener("click",(ev)=>{
      const p=ev.target.getAttribute("data-p"), a=ev.target.getAttribute("data-a");
      if(p){ etat[p].present=true; etat[p].absent=false; render(); }
      if(a){ etat[a].present=false; etat[a].absent=true; if(!etat[a].motif)etat[a].motif="Congé"; render(); }
    });
    $("#liste").addEventListener("change",(ev)=>{
      const m=ev.target.getAttribute("data-motif"); if(m) etat[m].motif=ev.target.value;
    });
    $("#in-rech").addEventListener("input",render);
  }
  function tousPresents(){ (roster.salaries||[]).forEach(s=>{ if(dansEquipe(s)){ const e=etat[wkey(s)]; if(e){e.present=true;e.absent=false;} } }); render(); }

  // ───────── Chantier sélectionné ─────────
  function remplirSites(){
    const sel=$("#in-site"); sel.innerHTML="";
    (roster.sites||[]).forEach(s=>{ const o=document.createElement("option"); o.value=s.id; o.textContent=s.nom; sel.appendChild(o); });
    if(!(roster.sites||[]).length){ const o=document.createElement("option"); o.value=""; o.textContent="Aucun chantier"; sel.appendChild(o); }
    selSite = roster.default_site_id || ((roster.sites||[])[0]||{}).id || null;
    if(selSite!=null) sel.value=selSite;
    sel.addEventListener("change",()=>{ selSite=parseInt(sel.value)||null; render(); });
  }

  // ───────── Ajouter un travailleur permuté ─────────
  function renderAjout(){
    const q=($("#in-rech-ajout").value||"").toLowerCase();
    const box=$("#liste-ajout"); box.innerHTML="";
    (roster.salaries||[]).forEach(s=>{
      if(dansEquipe(s)) return;                       // déjà dans l'équipe du chantier
      const nom=(s.nom+" "+(s.prenom||"")).toLowerCase();
      if(q && nom.indexOf(q)<0) return;
      const d=document.createElement("div"); d.className="sal";
      const tj = s.type==="J" ? ' <span style="font-size:.62rem;background:#eef4f2;color:#17564c;padding:.05rem .35rem;border-radius:.3rem">journalier</span>' : '';
      d.innerHTML='<div class="nom">'+s.nom+' '+(s.prenom||'')+tj+'<small>'+(s.emploi||'')+'</small></div>'+
        '<button class="btn ghost" style="width:auto;padding:.4rem .8rem" data-add="'+wkey(s)+'">Ajouter</button>';
      box.appendChild(d);
    });
  }
  function bindAjout(){
    $("#btn-ajouter").addEventListener("click",()=>{ $("#panel-ajout").classList.toggle("hidden"); renderAjout(); });
    $("#in-rech-ajout").addEventListener("input",renderAjout);
    $("#liste-ajout").addEventListener("click",(ev)=>{
      const k=ev.target.getAttribute("data-add"); if(!k) return;
      ajoutes.add(k); if(!etat[k]) etat[k]={present:true,absent:false,motif:"",hn:null,hs:null};
      renderAjout(); render(); toast("Travailleur ajouté au chantier.");
    });
  }

  // ───────── GPS (une capture par enregistrement) ─────────
  function position(){ return new Promise((res)=>{
    if(!navigator.geolocation) return res({});
    navigator.geolocation.getCurrentPosition(
      p=>res({latitude:p.coords.latitude, longitude:p.coords.longitude}),
      ()=>res({}), {enableHighAccuracy:true, timeout:6000, maximumAge:60000});
  });}

  // ───────── Enregistrer le pointage du jour (→ file locale) ─────────
  async function enregistrer(){
    const d=$("#in-date").value; if(!d){ toast("Choisissez une date."); return; }
    if(selSite==null){ toast("Choisissez un chantier."); return; }
    const hn=parseFloat($("#in-hn").value||"8")||0, hs=parseFloat($("#in-hs").value||"0")||0;
    $("#btn-save").disabled=true; $("#btn-save").textContent="Localisation…";
    const pos=await position();
    let n=0;
    // On n'enregistre que l'équipe visible du chantier choisi.
    for(const s of (roster.salaries||[])){
      if(!dansEquipe(s)) continue;
      const e=etat[wkey(s)]; if(!e) continue;
      const item={ uuid:(crypto.randomUUID?crypto.randomUUID():(Date.now()+"-"+s.type+s.id+"-"+Math.random().toString(16).slice(2))),
        date:d, site_id:selSite, type:s.type, worker_id:s.id, present:e.present, absent:e.absent,
        motif_absence:e.absent?e.motif:null,
        heures_normales:e.absent?0:(e.hn!=null?e.hn:hn),
        heures_sup_10:e.absent?0:(e.hs!=null?e.hs:hs),
        latitude:pos.latitude!=null?pos.latitude:null, longitude:pos.longitude!=null?pos.longitude:null };
      await idbSet("queue",null,item); n++;
    }
    $("#btn-save").disabled=false; $("#btn-save").textContent="Enregistrer le pointage";
    toast(n+" pointage(s) enregistré(s) sur l'appareil.");
    await majPending();
    if(navigator.onLine) sync();
    else toast("Hors-ligne : sera envoyé à la reconnexion.");
  }

  // ───────── Synchronisation idempotente ─────────
  async function majPending(){ const q=await idbAll("queue"); const el=$("#pend"); el.textContent=q.length?("("+q.length+")"):""; return q.length; }
  let enCours=false;
  async function sync(){
    if(enCours) return; const q=await idbAll("queue");
    if(!q.length){ return; }
    if(!navigator.onLine){ toast("Hors-ligne."); return; }
    enCours=true; $("#btn-sync").disabled=true;
    try{
      const r=await fetch(API+"/sync",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
        body:JSON.stringify({pointages:q})});
      if(r.status===401){ toast("Session expirée, reconnectez-vous."); deconnexion(); return; }
      const data=await r.json();
      let ok=0,confl=0;
      for(const res of (data.resultats||[])){
        if(["cree","doublon","conflit"].includes(res.etat)){ await idbDel("queue",res.uuid); if(res.etat==="cree")ok++; if(res.etat==="conflit")confl++; }
        else if(res.etat==="erreur"){ await idbDel("queue",res.uuid); } // erreur permanente (hors équipe, date) → on purge
      }
      await majPending();
      toast(ok+" envoyé(s)"+(confl?(" · "+confl+" déjà présent(s)"):"")+".");
    }catch(e){ toast("Envoi impossible (réseau). Réessaie plus tard."); }
    finally{ enCours=false; $("#btn-sync").disabled=false; }
  }

  // ───────── Connexion / session ─────────
  async function login(){
    const code=($("#in-code").value||"").trim().toUpperCase(), pin=($("#in-pin").value||"").trim();
    $("#login-err").textContent="";
    if(!code||!pin){ $("#login-err").textContent="Code et PIN requis."; return; }
    $("#btn-login").disabled=true; $("#btn-login").textContent="Connexion…";
    try{
      const r=await fetch(API+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,pin})});
      const data=await r.json();
      if(!data.ok){ $("#login-err").textContent=data.erreur||"Échec."; return; }
      token=data.token; roster=data;
      await idbSet("meta","token",token); await idbSet("meta","roster",roster);
      demarrer();
    }catch(e){ $("#login-err").textContent="Connexion au serveur impossible."; }
    finally{ $("#btn-login").disabled=false; $("#btn-login").textContent="Se connecter"; }
  }
  async function rafraichirRoster(){ // au démarrage si en ligne, pour mettre à jour l'équipe
    if(!navigator.onLine||!token) return;
    try{ const r=await fetch(API+"/roster",{headers:{"Authorization":"Bearer "+token}});
      if(r.ok){ const d=await r.json(); if(d.ok){ roster=d; await idbSet("meta","roster",roster); } } }catch(e){}
  }
  async function deconnexion(){ token=null; roster=null;
    await idbSet("meta","token",null); await idbSet("meta","roster",null);
    $("#vue-app").classList.add("hidden"); $("#vue-login").classList.remove("hidden"); }

  function demarrer(){
    $("#vue-login").classList.add("hidden"); $("#vue-app").classList.remove("hidden");
    $("#h-ent").textContent = roster.entreprise||"";
    if(!$("#in-date").value) $("#in-date").value = new Date().toISOString().slice(0,10);
    ajoutes = new Set();
    remplirSites(); initEtat(); render(); majPending(); majReseau();
    rafraichirRoster().then(()=>{ remplirSites(); initEtat(); render(); });
    if(navigator.onLine) sync();
  }

  // ───────── Démarrage ─────────
  async function boot(){
    majReseau();
    window.addEventListener("online", ()=>{ majReseau(); sync(); });
    window.addEventListener("offline", majReseau);
    $("#btn-login").addEventListener("click",login);
    $("#in-pin").addEventListener("keydown",e=>{ if(e.key==="Enter")login(); });
    $("#btn-save").addEventListener("click",enregistrer);
    $("#btn-sync").addEventListener("click",sync);
    $("#btn-logout").addEventListener("click",(e)=>{e.preventDefault(); if(confirm("Changer de pointeur ?")) deconnexion();});
    bindListe(); bindAjout();
    token=await idbGet("meta","token"); roster=await idbGet("meta","roster");
    if(token&&roster){ demarrer(); } else { $("#vue-login").classList.remove("hidden"); }
    if("serviceWorker" in navigator){
      try{ await navigator.serviceWorker.register("/m/sw.js",{scope:"/m"});
        navigator.serviceWorker.addEventListener("message",ev=>{ if(ev.data&&ev.data.type==="sync-pointages") sync(); });
      }catch(e){}
    }
  }
  document.addEventListener("DOMContentLoaded",boot);
  return { tousPresents };
})();
</script>
</body>
</html>
