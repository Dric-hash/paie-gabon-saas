<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Merci — PaieGabon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>:root{--vert:#0f3d36;--vert-d:#0a2b25;--or:#d99e0b}
    body{background:radial-gradient(120% 90% at 82% 8%,#16564a 0%,var(--vert) 46%,var(--vert-d) 100%)}</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 text-white text-center">
  <div class="max-w-lg">
    <div style="width:72px;height:72px;border-radius:20px;background:var(--or);color:var(--vert);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:38px;margin:0 auto 1.5rem">✓</div>
    <h1 class="text-4xl font-black">Merci !</h1>
    <p class="text-white/80 mt-3 text-lg">Votre avis compte vraiment. Chaque retour nous aide à faire de PaieGabon un meilleur outil pour les entreprises gabonaises.</p>
    <a href="/" class="inline-block mt-8 font-bold rounded-xl px-6 py-3" style="background:#fff;color:var(--vert)">Retour à l'accueil</a>
  </div>
</body>
</html>
