name: CI

# Lance la suite de tests et l'audit de dépendances à chaque push / pull request
# sur la branche main. Objectif : ne jamais déployer une régression sur de la paie.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: Tests & audit
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lancer les tests (bloquant)
        # Les tests utilisent SQLite en mémoire : aucun service externe requis.
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: pytest -q

      - name: Audit de sécurité des dépendances (informatif)
        # N'échoue pas le build : signale les vulnérabilités connues sans bloquer,
        # le temps de planifier les mises à jour (werkzeug/flask, cf. audit M6).
        run: pip-audit -r requirements.txt
        continue-on-error: true
